<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Here's What Yer Gonna Do</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Scanline overlay -->
  <div class="scanlines" aria-hidden="true"></div>

  <div class="container">

    <!-- ── Header ── -->
    <header>
      <div class="badge">
        <span class="badge-dot"></span>
        <span class="badge-text">AI BRIEFING SYSTEM</span>
        <span class="badge-dot"></span>
      </div>
      <h1>
        <span class="h1-top">HERE'S WHAT</span>
        <span class="h1-accent">YER GONNA DO</span>
      </h1>
      <p class="tagline">
        Enter your to-do list.<br />
        Mike will make sure you understand the gravity of the situation.
      </p>
    </header>

    <!-- ── Input section ── -->
    <section id="input-section">
      <div class="card">
        <div class="card-label">YOUR ASSIGNMENT, KID</div>

        <div id="todo-list">
          <div class="todo-row" data-index="0">
            <span class="todo-num">01</span>
            <input
              type="text"
              class="todo-input"
              placeholder="e.g. Buy groceries"
              maxlength="120"
              autocomplete="off"
            />
            <button class="remove-row" aria-label="Remove" tabindex="-1">✕</button>
          </div>
        </div>

        <button id="add-row-btn" class="btn-ghost">
          <span>＋ ADD ITEM</span>
        </button>
      </div>

      <button id="generate-btn" class="btn-primary">
        <span class="btn-primary-main">GET YOUR ORDERS</span>
        <span class="btn-primary-sub">Mike's waiting. Don't keep him.</span>
      </button>
    </section>

    <!-- ── Loading section ── -->
    <section id="loading-section" class="hidden">
      <div class="loading-card">
        <div class="mike-icon" aria-hidden="true">
          <svg viewBox="0 0 80 100" xmlns="http://www.w3.org/2000/svg">
            <!-- Silhouette: hat -->
            <ellipse cx="40" cy="22" rx="26" ry="6" fill="currentColor"/>
            <rect x="28" y="10" width="24" height="14" rx="2" fill="currentColor"/>
            <!-- Head -->
            <ellipse cx="40" cy="42" rx="18" ry="20" fill="currentColor"/>
            <!-- Shoulders / jacket -->
            <path d="M14 100 Q14 70 26 65 L40 68 L54 65 Q66 70 66 100Z" fill="currentColor"/>
            <!-- Tie suggestion -->
            <path d="M38 68 L40 80 L42 68Z" fill="#c8a020" opacity="0.7"/>
          </svg>
        </div>
        <div id="loading-msg" class="loading-msg">Initiating contact…</div>
        <div class="loading-bar-track">
          <div id="loading-bar" class="loading-bar-fill"></div>
        </div>
        <div id="loading-step" class="loading-step">STEP 1 / 3</div>
      </div>
    </section>

    <!-- ── Result section ── -->
    <section id="result-section" class="hidden">

      <!-- Video result -->
      <div id="video-wrap" class="hidden">
        <div class="video-frame">
          <video id="result-video" controls playsinline></video>
        </div>
      </div>

      <!-- Audio-only result -->
      <div id="audio-wrap" class="hidden">
        <div class="audio-display-card">
          <div class="audio-mike-icon" aria-hidden="true">
            <svg viewBox="0 0 80 100" xmlns="http://www.w3.org/2000/svg">
              <ellipse cx="40" cy="22" rx="26" ry="6" fill="currentColor"/>
              <rect x="28" y="10" width="24" height="14" rx="2" fill="currentColor"/>
              <ellipse cx="40" cy="42" rx="18" ry="20" fill="currentColor"/>
              <path d="M14 100 Q14 70 26 65 L40 68 L54 65 Q66 70 66 100Z" fill="currentColor"/>
              <path d="M38 68 L40 80 L42 68Z" fill="#c8a020" opacity="0.7"/>
            </svg>
          </div>
          <div id="audio-pulse" class="audio-pulse hidden" aria-hidden="true">
            <span></span><span></span><span></span><span></span><span></span>
          </div>
          <audio id="result-audio" controls></audio>
        </div>
      </div>

      <!-- Script display -->
      <div class="script-card">
        <div class="card-label">THE BRIEF</div>
        <blockquote id="script-text"></blockquote>
      </div>

      <button id="reset-btn" class="btn-ghost btn-reset">⟳ NEW ORDERS</button>
    </section>

    <!-- ── Error section ── -->
    <section id="error-section" class="hidden">
      <div class="error-card">
        <div class="error-icon">⚠</div>
        <p id="error-msg">Something went wrong.</p>
        <button id="retry-btn" class="btn-ghost">TRY AGAIN</button>
      </div>
    </section>

  </div><!-- /container -->

  <footer>
    <p>Powered by Claude · ElevenLabs · D-ID &nbsp;|&nbsp; Inspired by the man himself</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
